apiVersion: apps/v1
kind: Deployment
metadata:
  name: elastic
  labels:
    app: elastic
spec:
  replicas: 1
  template:
    metadata:
      name: elastic
      labels:
        app: elastic
    spec:
      containers:
        - name: elastic
          image: docker.elastic.co/elasticsearch/elasticsearch:9.2.0
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              memory: "1.5Gi"
              cpu: "500m"
            limits:
              memory: "1.5Gi"
              cpu: "1000m"
          env:
            - name: discovery.type
              value: single-node
            - name: ES_JAVA_OPTS
              value: "-Xms512m -Xmx512m"
            - name: xpack.security.enabled
              value: "false"
            - name: node.name
              value: elastic
            - name: cluster.name
              value: elastic
            - name: xpack.license.self_generated.type
              value: basic
      restartPolicy: Always
  selector:
    matchLabels:
      app: elastic

---
apiVersion: v1
kind: Service
metadata:
  name: elastic
spec:
  selector:
    app: elastic
  ports:
  - port: 9200
    name: http
  - port: 9300
    name: http2
  type: NodePort            